<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SC Agris - Gestion des notes</title>
  <style>
    :root {
      --bg-black: #0b0b0d;
      --bg-charcoal: #16171b;
      --card-bg: #1e2026;
      --gold: #d4af37;
      --gold-light: #f3cf55;
      --gold-dark: #aa820a;
      --text-main: #f5f5f7;
      --text-muted: #9a9da6;
      --danger: #ff4d4f;
      --success: #2ecc71;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-black);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* HEADER OR & NOIR */
    header {
      background: linear-gradient(180deg, #1f2128 0%, #121317 100%);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--gold);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-light), var(--gold-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #000;
      font-size: 1rem;
      border: 2px solid #fff;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .badge-site {
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold-light);
      border: 1px solid var(--gold);
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-sync {
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: #0b0b0d;
      border: none;
      padding: 9px 15px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3);
    }

    .btn-sync:active {
      transform: scale(0.97);
    }

    .btn-icon {
      background: var(--card-bg);
      color: var(--gold);
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 1.15rem;
      cursor: pointer;
    }

    /* BARRE D'ONGLETS */
    .nav-tabs {
      display: flex;
      background: var(--bg-charcoal);
      border-bottom: 1px solid #2a2d36;
    }

    .tab-btn {
      flex: 1;
      padding: 13px;
      text-align: center;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.15s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tab-btn.active {
      color: var(--gold-light);
      border-bottom-color: var(--gold);
      background: rgba(212, 175, 55, 0.06);
    }

    /* SECTIONS */
    .view-section {
      display: none;
      flex: 1;
      overflow: hidden;
    }

    .view-section.active {
      display: flex;
    }

    /* GRILLE PRODUITS & CAISSE */
    .caisse-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .products-grid {
      flex: 2;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      grid-auto-rows: 155px;
      gap: 14px;
      overflow-y: auto;
    }

    .prod-card {
      background: linear-gradient(145deg, #22252d, #191b20);
      border: 1.5px solid #2e323d;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.15s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .prod-card:active {
      transform: scale(0.95);
      border-color: var(--gold);
    }

    .prod-svg {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .prod-name {
      font-weight: 700;
      font-size: 0.95rem;
      text-align: center;
      color: var(--text-main);
    }

    .prod-price {
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold-light);
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
    }

    /* PANIER A DROITE */
    .cart-panel {
      flex: 1;
      min-width: 310px;
      max-width: 380px;
      background: var(--bg-charcoal);
      border-left: 1px solid #2a2d36;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .cart-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #2a2d36;
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 6px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .cart-row-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-qty {
      background: #2b2f3a;
      color: var(--gold-light);
      border: 1px solid rgba(212, 175, 55, 0.3);
      width: 30px;
      height: 30px;
      border-radius: 7px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    .cart-total-box {
      background: #0e0f12;
      padding: 14px 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 12px;
      border: 1px solid var(--gold);
    }

    .cart-total-val {
      color: var(--gold-light);
    }

    .btn-pay {
      background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
      color: #000;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
    }
